    h+='</div></div>'+(i<4?'<div class="flowdown" aria-hidden="true">▼</div>':"");
  });
  h+='<div class="flowdown" aria-hidden="true">▼</div><div class="layer"><h3>Consolidação</h3><div class="mods"><button class="modbtn" data-go="projeto-final"><b>PF</b>Projeto integrador final</button></div></div></section>';
  h+='<section class="card"><h3>Roadmap de evolução</h3>';
  PHASES.forEach(function(p,i){h+='<div class="phase"><div class="n">'+(i+1)+'</div><div><b>'+esc(p[0])+'</b> <span class="chip">'+esc(p[1])+'</span><p style="color:var(--muted)">'+esc(p[2])+'</p></div></div>'});
  h+='</section>';
  h+='<section class="card"><h3>As sete etapas de cada módulo</h3><ol>'+
   '<li><b>Fundamentos.</b> Conceitos, problema que resolve, lugar na arquitetura e alternativas.</li>'+
   '<li><b>Aula técnica.</b> Funcionamento interno, decisões de arquitetura, erros comuns, protótipo versus produção.</li>'+
   '<li><b>Laboratório guiado.</b> Implementação conduzida passo a passo, com cada arquivo explicado.</li>'+
   '<li><b>Exercícios.</b> Dificuldade progressiva. Você tenta primeiro; a correção vem depois.</li>'+
   '<li><b>Mini projeto.</b> Um problema realista de empresa usando o que foi estudado.</li>'+
   '<li><b>Boas práticas.</b> Segurança, testes, observabilidade, custo e documentação.</li>'+
   '<li><b>Avaliação.</b> Questões, desafio sem roteiro e devolutiva de pontos fortes e lacunas.</li></ol></section>';
  h+='<section class="card"><h3>Como ler as marcações</h3><div class="chips"><span class="tag c">Conceito consolidado</span><span class="tag b">Boa prática recomendada</span><span class="tag e">Escolha arquitetural</span></div><p style="color:var(--muted)">Conceito consolidado é como a tecnologia funciona. Boa prática é o que a experiência recomenda. Escolha arquitetural depende do seu contexto e precisa ser justificada.</p></section>';
  h+='<section class="card"><h3>Regras da formação</h3><ul><li>Uma etapa por vez, na sequência. O mentor só avança com a sua confirmação.</li><li>Exercícios e desafios não trazem resposta aqui. Leve sua tentativa ao mentor no chat.</li><li>Versões de bibliotecas e limites de planos gratuitos são conferidos na documentação oficial no momento de cada laboratório.</li><li>Esta página é o mapa do curso. As aulas completas, o código e as correções acontecem na conversa com o mentor.</li></ul></section>';
  return h;
}
function stageBody(m,s){
  var h="";
  var r=REPO[m.n]||{};
  if(s===1){
    if(r.src){h+='<div class="card"><div class="eyebrow">Material do curso no repositório</div><div class="chips">'+r.src.map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join("")+'</div><p>'+esc(r.resumo)+'</p><div><button class="btn" data-stage="3">Ver o laboratório deste material →</button></div></div>'}
    else if(r.note){h+='<div class="card"><div class="eyebrow">Repositório do curso</div><p>'+r.note+'</p></div>'}
    h+='<div class="grid2"><div class="card"><h3>Por que importa</h3><p>'+esc(m.why)+'</p></div><div class="card"><h3>Onde se encaixa</h3><p>'+esc(m.fit)+'</p></div></div>';
    h+='<div class="card"><span class="tag e">Escolha arquitetural</span><h3>Alternativas comparadas</h3><p>'+esc(m.alt)+'</p></div>';
    h+='<div class="card"><span class="tag c">Conceito consolidado</span><h3>Conceitos do módulo</h3><div class="concepts">'+m.con.map(function(c){return '<div class="concept"><b>'+esc(c[0])+'</b><span>'+esc(c[1])+'</span></div>'}).join("")+'</div></div>';
  }else if(s===2){
    h+='<div class="card"><h3>Como funciona por dentro</h3><ul>'+li(m.deep)+'</ul></div>';
    if(r.concepts){h+='<div class="card"><div class="eyebrow">No código do curso</div><h3>Como o repositório aplica estes conceitos</h3><ul>'+r.concepts.map(function(c){return "<li>"+c+"</li>"}).join("")+'</ul></div>'}
    h+='<div class="card"><h3>Erros comuns</h3><ul>'+li(m.err)+'</ul></div>';
    h+='<div class="card"><h3>Protótipo versus produção</h3><div class="tblwrap"><table><thead><tr><th>Protótipo</th><th>Produção</th></tr></thead><tbody>'+m.pp.map(function(p){return "<tr><td>"+esc(p[0])+"</td><td>"+esc(p[1])+"</td></tr>"}).join("")+'</tbody></table></div></div>';
  }else if(s===3){
    h+=labGuide(m);
  }else if(s===4){
    var exl=m.ex.map(function(e){return [e[0],esc(e[1]),false]}).concat((r.ex||[]).map(function(e){return [e[0],e[1],true]}));
    var ord={"Básico":0,"Intermediário":1,"Avançado":2};exl.sort(function(a,b){return ord[a[0]]-ord[b[0]]});
    h+='<ul class="exs">'+exl.map(function(e){var k=e[0]==="Básico"?"l1":(e[0]==="Intermediário"?"l2":"l3");return '<li><span class="lvl '+k+'">'+esc(e[0])+'</span><span>'+e[1]+(e[2]?' <span class="chip">sobre o código do repositório</span>':'')+'</span></li>'}).join("")+'</ul>';
    h+='<p class="note">Sem gabarito nesta página, de propósito. Resolva, envie sua tentativa ao mentor e receba a avaliação com erros apontados e melhorias.</p>';
  }else if(s===5){
    if(r.proj){h+='<div class="card"><div class="eyebrow">Projeto de referência no repositório</div><div class="chips">'+r.src.map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join("")+'</div><p>'+esc(r.proj)+'</p></div>'}
    h+='<div class="card"><div class="eyebrow">Mini projeto aplicado</div><h3>'+esc(m.pj.t)+'</h3><p><b>Cenário.</b> '+esc(m.pj.cen)+'</p><p><b>Requisitos.</b></p><ul>'+li(m.pj.req)+'</ul><p><b>Entregáveis.</b></p><ul><li>Repositório com instruções de execução.</li><li>Registro das decisões técnicas e das alternativas descartadas.</li><li>Testes automatizados do caminho crítico.</li></ul></div>';
  }else if(s===6){
    h+='<div class="card"><span class="tag b">Boa prática recomendada</span><h3>Práticas deste módulo</h3><ul>'+li(m.bp)+'</ul></div>';
    h+='<div class="card"><h3>Lista de verificação permanente</h3><ul><li>Código modular, com responsabilidades separadas.</li><li>Credenciais fora do código e do repositório.</li><li>Exceções tratadas e registradas com contexto.</li><li>Testes de unidade e de integração.</li><li>Custo e latência medidos.</li><li>Documentação que permite a outra pessoa executar.</li></ul></div>';
  }else{
    h+='<div class="card"><h3>Questões</h3><ol>'+li(m.qz)+'</ol></div>';
    h+='<div class="card"><div class="eyebrow">Desafio sem roteiro</div><p>'+esc(m.ch)+'</p></div>';
    h+='<p class="note">Ao concluir, o mentor apresenta seus pontos fortes, as lacunas identificadas e o que revisar antes de avançar, e atualiza o plano de aprendizagem.</p>';
  }
  return h;
}
function viewModule(n){
  var m=mod(n);if(!m){return viewHome()}
  var s=stageSel[n]||1,idx=ORDER.indexOf(n),h="";
  var unlock=M.filter(function(x){return x.dep.indexOf(n)>=0});
  h+='<section class="hero"><div class="eyebrow">Módulo '+m.n+' de 15 · '+esc(LAYERS[LAYER_OF[m.n]].split(" · ")[0])+'</div><h2>'+esc(m.t)+'</h2><p>'+esc(m.s)+'</p></section>';
  h+='<div class="chips"><span class="chip">Depende de</span>'+(m.dep.length?m.dep.map(function(d){return '<button class="chip" data-go="modulo-'+d+'">M'+d+' '+esc(mod(d).t)+'</button>'}).join(""):'<span class="chip">Nenhum módulo anterior</span>')+(unlock.length?'<span class="chip">Prepara para</span>'+unlock.map(function(u){return '<button class="chip" data-go="modulo-'+u.n+'">M'+u.n+' '+esc(u.t)+'</button>'}).join(""):"")+'</div>';
  h+='<div class="steps" role="tablist" aria-label="Etapas do módulo">'+STAGES.map(function(t,i){return '<button class="step'+(prog[n+"-"+(i+1)]?" ok":"")+'" role="tab" aria-selected="'+(s===i+1)+'" data-stage="'+(i+1)+'"><b>'+(i+1)+'</b>'+t+'</button>'}).join("")+'</div>';
  h+='<div class="stagehead"><h3>Etapa '+s+' · '+STAGES[s-1]+'</h3><label class="check"><input type="checkbox" id="chk-'+n+'-'+s+'"'+(prog[n+"-"+s]?" checked":"")+' data-check="'+n+'-'+s+'">Etapa concluída</label></div>';
  h+=stageBody(m,s);
  h+='<div class="pager">';
  if(s>1){h+='<button class="btn" data-stage="'+(s-1)+'">← Etapa '+(s-1)+'</button>'}else if(idx>0){h+='<button class="btn" data-go="modulo-'+ORDER[idx-1]+'">← Módulo '+ORDER[idx-1]+'</button>'}else{h+='<span></span>'}
  if(s<7){h+='<button class="btn primary" data-stage="'+(s+1)+'">Etapa '+(s+1)+' · '+STAGES[s]+' →</button>'}else if(idx<ORDER.length-1){h+='<button class="btn primary" data-go="modulo-'+ORDER[idx+1]+'" data-stage="1">Módulo '+ORDER[idx+1]+' · '+esc(mod(ORDER[idx+1]).t)+' →</button>'}else{h+='<button class="btn primary" data-go="projeto-final">Projeto integrador →</button>'}
  h+='</div>';
  return h;
}
function viewFinal(){
  var h='<section class="hero"><div class="eyebrow">Projeto integrador final</div><h2>Central de Operações Inteligente</h2><p>Um assistente corporativo que responde com base em documentos internos, consulta dados operacionais, executa ações em sistemas externos com aprovação humana e roda em nuvem com qualidade e custo monitorados.</p></section>';
  h+='<div class="card"><h3>Construção incremental</h3><div class="tblwrap"><table><thead><tr><th>Fase</th><th>Entrega</th><th>Módulos</th></tr></thead><tbody>'+FINAL.map(function(f,i){return "<tr><td><b>"+(i+1)+". "+esc(f[0])+"</b></td><td>"+esc(f[1])+"</td><td>"+esc(f[2])+"</td></tr>"}).join("")+'</tbody></table></div></div>';
  h+='<div class="grid2"><div class="card"><h3>O que o projeto precisa contemplar</h3><ul><li>Arquitetura de solução documentada.</li><li>Backend e APIs.</li><li>LLM com provedor substituível.</li><li>RAG e banco vetorial.</li><li>Agentes orquestrados com LangGraph.</li><li>Integrações via MCP.</li><li>Persistência e memória.</li><li>Testes e avaliação.</li><li>Observabilidade e LLMOps.</li><li>Contêineres e deploy em nuvem.</li><li>Segurança e escalabilidade.</li></ul></div><div class="card"><h3>Como será avaliado</h3><ul><li>Cada decisão arquitetural registrada com alternativas e justificativa.</li><li>Métricas de qualidade, custo e latência medidas, não estimadas.</li><li>Outra pessoa consegue executar a partir da documentação.</li><li>Você explica e defende o sistema de ponta a ponta.</li></ul></div></div>';
  return h;
}
function viewTools(){
  var h='<section class="hero"><div class="eyebrow">Ferramentas</div><h2>O que você vai usar e a alternativa gratuita</h2><p>O curso não se prende a um fornecedor. Para todo serviço pago há um caminho gratuito, de código aberto ou de baixo custo.</p></section>';
  h+='<div class="card"><div class="tblwrap"><table><thead><tr><th>Necessidade</th><th>Ferramenta principal</th><th>Alternativa gratuita ou de baixo custo</th></tr></thead><tbody>'+TOOLS.map(function(t){return "<tr><td><b>"+esc(t[0])+"</b></td><td>"+esc(t[1])+"</td><td>"+esc(t[2])+"</td></tr>"}).join("")+'</tbody></table></div></div>';
  h+='<p class="note">Limites de planos gratuitos e versões de bibliotecas mudam com frequência. O mentor confere cada um na documentação oficial no início do laboratório correspondente.</p>';
  return h;
}
function summaryText(){
  var t=total(),lines=["Progresso na Formação em Engenharia de IA: "+t+" de 105 etapas."];
  M.forEach(function(m){var d=[];for(var s=1;s<=7;s++){if(prog[m.n+"-"+s]){d.push(s)}}lines.push("Módulo "+m.n+" ("+m.t+"): "+(d.length?"etapas "+d.join(", ")+" concluídas":"não iniciado"))});
  var np=nextPending();if(np){lines.push("Próxima etapa: Módulo "+np[0]+", Etapa "+np[1]+" ("+STAGES[np[1]-1]+").")}
  return lines.join("\n");
}
var askReset=false;
function viewProgress(){
  var h='<section class="hero"><div class="eyebrow">Acompanhamento</div><h2>Meu progresso</h2><p>As marcações ficam salvas apenas neste navegador. Para o mentor atualizar o plano de aprendizagem, copie o resumo e cole na conversa.</p></section>';
  h+='<div class="card"><div class="tblwrap"><table><thead><tr><th>Módulo</th><th>Etapas 1 a 7</th><th>Concluídas</th></tr></thead><tbody>'+M.map(function(m){var d="";for(var s=1;s<=7;s++){d+='<i class="'+(prog[m.n+"-"+s]?"on":"")+'" title="Etapa '+s+'"></i>'}return '<tr><td><button class="chip" data-go="modulo-'+m.n+'">M'+m.n+'</button> '+esc(m.t)+'</td><td><div class="dots">'+d+'</div></td><td>'+doneCount(m.n)+'/7</td></tr>'}).join("")+'</tbody></table></div></div>';
  h+='<div class="card"><h3>Resumo para o mentor</h3><textarea id="sumtxt" readonly aria-label="Resumo do progresso">'+esc(summaryText())+'</textarea><div class="chips"><button class="btn primary" id="copybtn">Copiar resumo</button>'+(askReset?'<button class="btn danger" id="resetyes">Confirmar: apagar todas as marcações</button><button class="btn" id="resetno">Cancelar</button>':'<button class="btn" id="resetask">Zerar progresso</button>')+'</div><div class="status" id="copystatus" role="status"></div></div>';
  return h;
}
function render(){
  var r=route(),v=document.getElementById("view"),h;
  if(r.indexOf("modulo-")===0){h=viewModule(parseInt(r.slice(7),10))}
  else if(r==="projeto-final"){h=viewFinal()}
  else if(r==="ferramentas"){h=viewTools()}
  else if(r==="repositorio"){h=viewRepo()}
  else if(r==="meu-progresso"){h=viewProgress()}
  else{h=viewHome()}
  v.innerHTML=h;renderNav();
}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t){return}
  if(t.id==="copybtn"){
    var st=document.getElementById("copystatus"),ta=document.getElementById("sumtxt");
    try{navigator.clipboard.writeText(ta.value).then(function(){st.textContent="Resumo copiado. Cole na conversa com o mentor."}).catch(function(){ta.select();st.textContent="Não foi possível copiar automaticamente. O texto está selecionado: copie com Ctrl+C."})}catch(err){ta.select();st.textContent="O texto está selecionado: copie com Ctrl+C."}
    return;
  }
  if(t.hasAttribute("data-copy")){
    var pre=t.parentNode.querySelector("pre");
    try{navigator.clipboard.writeText(pre.textContent).then(function(){t.textContent="Copiado"}).catch(function(){t.textContent="Selecione e copie"})}catch(err){t.textContent="Selecione e copie"}
    setTimeout(function(){t.textContent="Copiar"},1600);return;
  }
  if(t.hasAttribute("data-os")){osSel=t.getAttribute("data-os");try{localStorage.setItem(KEY+"-os",osSel)}catch(err){}render();return}
  if(t.id==="resetask"){askReset=true;render();return}
  if(t.id==="resetno"){askReset=false;render();return}
  if(t.id==="resetyes"){prog={};save();askReset=false;render();return}
  var g=t.getAttribute("data-go"),s=t.getAttribute("data-stage");
  if(g){if(s&&g.indexOf("modulo-")===0){stageSel[parseInt(g.slice(7),10)]=parseInt(s,10)}go(g);return}
  if(s){var r=route();if(r.indexOf("modulo-")===0){stageSel[parseInt(r.slice(7),10)]=parseInt(s,10);render();var sh=document.querySelector(".steps");if(sh){sh.scrollIntoView({block:"start"});window.scrollBy(0,-80)}}}
});
document.addEventListener("change",function(e){
  var k=e.target.getAttribute&&e.target.getAttribute("data-check");
  if(k){if(e.target.checked){prog[k]=true}else{delete prog[k]}save();render()}
});
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
